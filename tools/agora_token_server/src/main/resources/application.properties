# Import the local .env file as Java properties without committing secrets.
spring.config.import=optional:file:.env[.properties]

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:3000}

agora.app-id=${AGORA_APP_ID:}
agora.app-certificate=${AGORA_APP_CERTIFICATE:}

# Auth is optional for local USB development and must be enabled on public hosting.
firebase.auth.required=${FIREBASE_AUTH_REQUIRED:false}
firebase.project-id=${FIREBASE_PROJECT_ID:${GOOGLE_CLOUD_PROJECT:}}
